[project]
name = "transformer-from-scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "telamonian", email = "telamonian@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "torch",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# module-name = "transformer_from_scratch"
module-root = "pysrc"
# source-include = ["third_party.txt", "third_party_licenses.txt"]
# wheel-exclude = ["transformer_from_scratch/_smoke_tests/**"]

[tool.pytest.ini_options]
pythonpath = ["pysrc"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["transformer_from_scratch"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
